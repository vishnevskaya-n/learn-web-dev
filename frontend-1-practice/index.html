<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbie Style - Подтверждение</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo">
            <div class="logo-circle">
                <span class="logo-b">B</span>
            </div>
            <span class="logo-text">Barbie style</span>
        </div>
        <nav class="nav">
            <a href="#">Услуги</a>
            <a href="#">Галерея</a>
            <a href="#">Команда</a>
            <a href="#">Отзывы</a>
            <a href="#">Контакты</a>
        </nav>
    </header>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="step active">
                <span class="circle">1</span>
                <div class="line"></div>
            </div>
            <div class="step active">
                <span class="circle">2</span>
                <div class="line"></div>
            </div>
            <div class="step active">
                <span class="circle">3</span>
                <div class="line"></div>
            </div>
            <div class="step active current">
                <span class="circle">4</span>
                <div class="line"></div>
            </div>
            <div class="step inactive">
                <span class="circle"></span>
            </div>
        </div>
    </div>

    <main class="main-content">
        <h1>ПОДТВЕРЖДЕНИЕ:</h1>

        <div class="cards-wrapper">
            <div class="card calendar-card">
                <div class="card-header">
                    <h2>НОЯБРЬ 2026</h2>
                    <div class="arrows">
                        <button type="button" class="arrow" aria-label="Предыдущий месяц">&lt;</button>
                        <button type="button" class="arrow" aria-label="Следующий месяц">&gt;</button>
                    </div>
                </div>

                <div class="calendar-grid">
                    <div class="weekday">Пн</div>
                    <div class="weekday">Вт</div>
                    <div class="weekday">Ср</div>
                    <div class="weekday">Чт</div>
                    <div class="weekday">Пт</div>
                    <div class="weekday">Сб</div>
                    <div class="weekday">Вс</div>

                    <button type="button" class="day disabled" disabled>26</button>
                    <button type="button" class="day disabled" disabled>27</button>
                    <button type="button" class="day disabled" disabled>28</button>
                    <button type="button" class="day disabled" disabled>29</button>
                    <button type="button" class="day disabled" disabled>30</button>
                    <button type="button" class="day disabled" disabled>31</button>
                    <button type="button" class="day">1</button>

                    <button type="button" class="day">2</button>
                    <button type="button" class="day">3</button>
                    <button type="button" class="day">4</button>
                    <button type="button" class="day">5</button>
                    <button type="button" class="day">6</button>
                    <button type="button" class="day">7</button>
                    <button type="button" class="day">8</button>

                    <button type="button" class="day">9</button>
                    <button type="button" class="day">10</button>
                    <button type="button" class="day">11</button>
                    <button type="button" class="day">12</button>
                    <button type="button" class="day">13</button>
                    <button type="button" class="day selected">14</button>
                    <button type="button" class="day">15</button>

                    <button type="button" class="day">16</button>
                    <button type="button" class="day">17</button>
                    <button type="button" class="day">18</button>
                    <button type="button" class="day">19</button>
                    <button type="button" class="day">20</button>
                    <button type="button" class="day">21</button>
                    <button type="button" class="day">22</button>

                    <button type="button" class="day">23</button>
                    <button type="button" class="day">24</button>
                    <button type="button" class="day">25</button>
                    <button type="button" class="day">26</button>
                    <button type="button" class="day">27</button>
                    <button type="button" class="day">28</button>
                    <button type="button" class="day">29</button>

                    <button type="button" class="day">30</button>
                </div>
            </div>

            <div class="card time-card">
                <h2>Доступное время</h2>
                <div class="time-grid">
                    <button type="button" class="time-btn">10:00</button>
                    <button type="button" class="time-btn disabled" disabled>11:00<br><span>Занято</span></button>
                    <button type="button" class="time-btn">12:00</button>
                    <button type="button" class="time-btn disabled" disabled>13:00<br><span>Занято</span></button>
                    <button type="button" class="time-btn selected">14:00</button>
                    <button type="button" class="time-btn">15:00</button>
                    <button type="button" class="time-btn">16:00</button>
                    <button type="button" class="time-btn">17:00</button>
                </div>
            </div>
        </div>

        <div class="selection-summary">
            <span class="selection-label">Вы выбрали:</span>
            <span class="selection-value">14 ноября 2026, 14:00</span>
        </div>

        <button class="confirm-btn">ПОДТВЕРДИТЬ</button>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <div class="logo-circle small">
                    <span class="logo-b">B</span>
                </div>
            </div>
            <div class="footer-links">
                <a href="#">ПОДДЕРЖКА</a>
                <a href="#">ОСТАВИТЬ ОТЗЫВ</a>
                <a href="#">ПАРТНЕРСКАЯ ПРОГРАММА</a>
                <a href="#">О НАС</a>
            </div>
        </div>
    </footer>

</body>
</html>
